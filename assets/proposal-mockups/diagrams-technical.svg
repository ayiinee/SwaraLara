<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
<rect width="1800" height="1400" fill="#f6f8fb"/><style>text{font-family:Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.h{font-size:21px;font-weight:700;fill:#102a43}.t{font-size:17px;fill:#334e68}.box{fill:#fff;stroke:#9fb3c8;stroke-width:2}.blue{fill:#d9eaf7}.green{fill:#d9f2e6}.orange{fill:#fff1d6}.red{fill:#ffe3e3}.purple{fill:#eee2ff}.arrow{stroke:#52606d;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6z" fill="#52606d"/></marker></defs>
<text x="900" y="48" text-anchor="middle" class="title">Diagram Teknis SwaraLara — Data Simulasi</text>
<rect x="45" y="80" width="820" height="600" rx="20" class="box"/><text x="70" y="120" class="h">Gambar 4.1 — Arsitektur Sistem</text>
<rect x="80" y="165" width="180" height="70" rx="12" class="blue"/><text x="170" y="208" text-anchor="middle" class="t">Pengguna</text>
<rect x="330" y="140" width="260" height="120" rx="12" class="blue"/><text x="460" y="175" text-anchor="middle" class="h">Aplikasi Android</text><text x="460" y="205" text-anchor="middle" class="t">Recorder • Crypto • Vault</text><text x="460" y="232" text-anchor="middle" class="t">Playback • WorkManager</text>
<rect x="660" y="140" width="160" height="120" rx="12" class="red"/><text x="740" y="185" text-anchor="middle" class="t">Edge API</text><text x="740" y="215" text-anchor="middle" class="t">Auth + Policy</text>
<path d="M260 200h70M590 200h70" class="arrow"/>
<rect x="330" y="350" width="260" height="100" rx="12" class="orange"/><text x="460" y="390" text-anchor="middle" class="t">Room + Internal Storage</text><text x="460" y="420" text-anchor="middle" class="t">Ciphertext .swseg</text>
<rect x="660" y="350" width="160" height="100" rx="12" class="red"/><text x="740" y="390" text-anchor="middle" class="t">PostgreSQL</text><text x="740" y="420" text-anchor="middle" class="t">Metadata + Audit</text>
<path d="M460 260v90M590 400h70" class="arrow"/><rect x="660" y="520" width="160" height="80" rx="12" class="red"/><text x="740" y="568" text-anchor="middle" class="t">Private Storage</text><path d="M740 450v70" class="arrow"/><text x="90" y="635" class="t">Server tidak menerima audio terbuka, DEK lengkap, atau share plaintext.</text>
<rect x="935" y="80" width="820" height="600" rx="20" class="box"/><text x="960" y="120" class="h">Gambar 4.2 — Aktivasi dan Perekaman</text>
<g class="t"><rect x="1010" y="165" width="250" height="58" rx="12" class="box"/><text x="1135" y="201" text-anchor="middle">Tekan tombol</text><rect x="1340" y="165" width="250" height="58" rx="12" class="purple"/><text x="1465" y="201" text-anchor="middle">≥ 1.500 ms?</text><rect x="1010" y="285" width="250" height="58" rx="12" class="box"/><text x="1135" y="321" text-anchor="middle">Periksa izin mikrofon</text><rect x="1340" y="285" width="250" height="58" rx="12" class="green"/><text x="1465" y="321" text-anchor="middle">Mulai foreground service</text><rect x="1010" y="405" width="250" height="58" rx="12" class="green"/><text x="1135" y="441" text-anchor="middle">AudioRecord aktif</text><rect x="1340" y="405" width="250" height="58" rx="12" class="green"/><text x="1465" y="441" text-anchor="middle">Segmentasi + enkripsi</text><rect x="1175" y="525" width="250" height="58" rx="12" class="orange"/><text x="1300" y="561" text-anchor="middle">Simpan ke vault</text></g><path d="M1260 194h80M1465 223v62M1340 314h-80M1260 343v62M1260 434h80M1465 463v62" class="arrow"/><text x="1010" y="635" class="t">Tekan singkat dibatalkan; melepas jari setelah aktif tidak menghentikan sesi.</text>
<rect x="45" y="730" width="820" height="600" rx="20" class="box"/><text x="70" y="770" class="h">Gambar 4.3 — Enkripsi Segmen</text><rect x="90" y="850" width="180" height="70" rx="12" class="blue"/><text x="180" y="892" text-anchor="middle" class="t">PCM 16-bit</text><rect x="335" y="830" width="220" height="110" rx="12" class="purple"/><text x="445" y="870" text-anchor="middle" class="t">Header SWL1</text><text x="445" y="900" text-anchor="middle" class="t">AAD + nonce</text><rect x="620" y="850" width="180" height="70" rx="12" class="green"/><text x="710" y="892" text-anchor="middle" class="t">AES-256-GCM</text><path d="M270 885h65M555 885h65" class="arrow"/><rect x="250" y="1050" width="360" height="80" rx="12" class="orange"/><text x="430" y="1084" text-anchor="middle" class="t">.swseg = header + ciphertext + tag</text><path d="M710 920v75M710 995H430v55" class="arrow"/><text x="90" y="1210" class="t">SHA-256 objectHash dan previousObjectHash mengikat urutan segmen.</text><text x="90" y="1250" class="t">Nonce: prefix acak 8 byte + indeks 4 byte.</text>
<rect x="935" y="730" width="820" height="600" rx="20" class="box"/><text x="960" y="770" class="h">Gambar 4.4 — Shamir Secret Sharing 2-of-3</text><rect x="1210" y="830" width="270" height="70" rx="12" class="purple"/><text x="1345" y="872" text-anchor="middle" class="t">DEK sesi 32 byte</text><rect x="1000" y="1010" width="180" height="70" rx="12" class="green"/><text x="1090" y="1052" text-anchor="middle" class="t">Share 1</text><rect x="1255" y="1010" width="180" height="70" rx="12" class="green"/><text x="1345" y="1052" text-anchor="middle" class="t">Share 2</text><rect x="1510" y="1010" width="180" height="70" rx="12" class="green"/><text x="1600" y="1052" text-anchor="middle" class="t">Share 3</text><path d="M1345 900v65M1345 965H1090v45M1345 965v45M1345 965h255v45" class="arrow"/><rect x="1160" y="1170" width="370" height="70" rx="12" class="orange"/><text x="1345" y="1212" text-anchor="middle" class="t">2 bagian valid → pulihkan DEK</text><path d="M1090 1080v55h70M1345 1080v55M1600 1080v55h-70" class="arrow"/><text x="960" y="1290" class="t">Satu bagian, duplikat, atau bagian salah → ditolak.</text>
</svg>
