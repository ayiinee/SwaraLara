<rect width="1800" height="2200" fill="#f3f6fa"/><style>text{font-family:Arial,sans-serif}.title{font-size:34px;font-weight:700;fill:#102a43}.label{font-size:24px;font-weight:700;fill:#102a43}.txt{font-size:18px;fill:#334e68}.small{font-size:15px;fill:#52606d}.card{fill:#fff;stroke:#bcccdc;stroke-width:2}.ok{fill:#d9f2e6;stroke:#1f9d70;stroke-width:2}.warn{fill:#fff1d6;stroke:#f3b33d;stroke-width:2}.dark{fill:#102a43}.phone{fill:#102a43}.screen{fill:#f8fafc}</style>
